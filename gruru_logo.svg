<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="timeWarp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A1F"/>
      <stop offset="100%" stop-color="#8C6BFF"/>
    </linearGradient>
    <linearGradient id="cyanLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EE6FF"/>
      <stop offset="100%" stop-color="#D7FF3A"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D7FF3A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D7FF3A" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Tech Hexagon Grid Frame -->
  <polygon points="200,30 330,105 330,255 200,330 70,255 70,105" 
           fill="none" stroke="#2C2C3A" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.35"/>
  <polygon points="200,45 315,112 315,248 200,315 85,248 85,112" 
           fill="#FFFFFF" fill-opacity="0.9" stroke="#E2E4EB" stroke-width="2"/>

  <!-- Circuit traces connecting to nodes -->
  <!-- Top vertex -->
  <path d="M 200,45 L 200,90 M 170,60 L 190,80 M 230,60 L 210,80" stroke="#8C6BFF" stroke-width="2" stroke-linecap="round"/>
  <!-- Bottom vertex -->
  <path d="M 200,315 L 200,270 M 170,300 L 190,280 M 230,300 L 210,280" stroke="#FF5A1F" stroke-width="2" stroke-linecap="round"/>
  <!-- Left vertices -->
  <path d="M 85,112 L 125,135 M 85,248 L 125,225 M 65,180 L 120,180" stroke="#2EE6FF" stroke-width="2" stroke-linecap="round"/>
  <!-- Right vertices -->
  <path d="M 315,112 L 275,135 M 315,248 L 275,225 M 335,180 L 280,180" stroke="#D7FF3A" stroke-width="2" stroke-linecap="round"/>

  <!-- Outer Graph Nodes -->
  <circle cx="200" cy="45" r="5" fill="#8C6BFF"/>
  <circle cx="315" cy="112" r="5" fill="#2EE6FF"/>
  <circle cx="315" cy="248" r="5" fill="#D7FF3A"/>
  <circle cx="200" cy="315" r="5" fill="#FF5A1F"/>
  <circle cx="85" cy="248" r="5" fill="#FFC233"/>
  <circle cx="85" cy="112" r="5" fill="#34E89E"/>

  <!-- Thai Prajam-yam Floral Diamond Core + Tech Kanok Elements -->
  <!-- 4 Primary Petals (Thai Traditional Prajam-yam Motif) -->
  <g transform="translate(200, 180)">
    <!-- North Petal (Tech Kanok Stupa) -->
    <path d="M 0,-65 C 18,-45 22,-25 0,-10 C -22,-25 -18,-45 0,-65 Z" 
          fill="url(#timeWarp)" stroke="#17171F" stroke-width="1.5"/>
    <path d="M 0,-50 C 8,-38 10,-22 0,-15 C -10,-22 -8,-38 0,-50 Z" fill="#D7FF3A"/>

    <!-- South Petal -->
    <path d="M 0,65 C 18,45 22,25 0,10 C -22,25 -18,45 0,65 Z" 
          fill="url(#timeWarp)" stroke="#17171F" stroke-width="1.5"/>
    <path d="M 0,50 C 8,38 10,22 0,15 C -10,22 -8,38 0,50 Z" fill="#2EE6FF"/>

    <!-- East Petal -->
    <path d="M 65,0 C 45,18 25,22 10,0 C 25,-22 45,-18 65,0 Z" 
          fill="url(#cyanLime)" stroke="#17171F" stroke-width="1.5"/>
    <path d="M 50,0 C 38,8 22,10 15,0 C 22,-10 38,-8 50,0 Z" fill="#8C6BFF"/>

    <!-- West Petal -->
    <path d="M -65,0 C -45,18 -25,22 -10,0 C -25,-22 -45,-18 -65,0 Z" 
          fill="url(#cyanLime)" stroke="#17171F" stroke-width="1.5"/>
    <path d="M -50,0 C -38,8 -22,10 -15,0 C -22,-10 -38,-8 -50,0 Z" fill="#FF5A1F"/>

    <!-- 4 Diagonal Tech Kanok Corner Flares -->
    <g transform="rotate(45)">
      <path d="M 0,-42 C 10,-30 12,-16 0,-8 C -12,-16 -10,-30 0,-42 Z" fill="#17171F"/>
      <circle cx="0" cy="-45" r="3" fill="#D7FF3A"/>
    </g>
    <g transform="rotate(135)">
      <path d="M 0,-42 C 10,-30 12,-16 0,-8 C -12,-16 -10,-30 0,-42 Z" fill="#17171F"/>
      <circle cx="0" cy="-45" r="3" fill="#2EE6FF"/>
    </g>
    <g transform="rotate(225)">
      <path d="M 0,-42 C 10,-30 12,-16 0,-8 C -12,-16 -10,-30 0,-42 Z" fill="#17171F"/>
      <circle cx="0" cy="-45" r="3" fill="#FF5A1F"/>
    </g>
    <g transform="rotate(315)">
      <path d="M 0,-42 C 10,-30 12,-16 0,-8 C -12,-16 -10,-30 0,-42 Z" fill="#17171F"/>
      <circle cx="0" cy="-45" r="3" fill="#8C6BFF"/>
    </g>

    <!-- Center Knowledge Core Rings -->
    <circle cx="0" cy="0" r="22" fill="#17171F" stroke="#D7FF3A" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="#0B0B0F"/>
    <circle cx="0" cy="0" r="8" fill="#D7FF3A" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Typography: GRURU MUSEUM -->
  <text x="200" y="365" text-anchor="middle" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#0B0B0F">GRURU</text>
  <text x="200" y="385" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" font-weight="600" letter-spacing="5" fill="#8C6BFF">MUSEUM</text>
</svg>
